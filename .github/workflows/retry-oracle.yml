name: Retry Oracle VM Creation

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: oracle-retry
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installer OCI CLI
        run: pip install oci-cli --break-system-packages

      - name: Configurer les identifiants Oracle
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_PRIVATE_KEY }}" > ~/.oci/key.pem
          chmod 600 ~/.oci/key.pem
          cat > ~/.oci/config << EOF
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          key_file=~/.oci/key.pem
          EOF
          chmod 600 ~/.oci/config

      - name: Boucle de tentatives (toutes les 5 min, pendant ~5h50)
        env:
          OCI_COMPARTMENT_ID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_AVAILABILITY_DOMAIN: ${{ secrets.OCI_AVAILABILITY_DOMAIN }}
          OCI_IMAGE_ID: ${{ secrets.OCI_IMAGE_ID }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          END_TIME=$(( $(date +%s) + 5*60*60 + 50*60 ))
          ATTEMPT=1
          while [ "$(date +%s)" -lt "$END_TIME" ]; do
            if [ -f instance_created.flag ]; then
              echo "Instance déjà créée, arrêt de la boucle."
              break
            fi
            echo "=== Tentative #$ATTEMPT ($(date -u +%H:%M:%S) UTC) ==="
            bash try_create_instance.sh
            if [ -f instance_created.flag ]; then
              echo "Succès à la tentative #$ATTEMPT !"
              break
            fi
            ATTEMPT=$((ATTEMPT + 1))
            sleep 300
          done

      - name: Sauvegarder le marqueur si succès
        run: |
          if [ -f instance_created.flag ]; then
            git config user.name "oracle-retry-bot"
            git config user.email "actions@github.com"
            git add instance_created.flag
            git commit -m "Instance créée avec succès [skip ci]" || true
            git push
          fi
